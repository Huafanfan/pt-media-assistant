# Optional overlay: docker compose --env-file .env.server -f compose.yaml -f compose.ai.yaml up -d --build app
# Provision the API key file separately, mode 0600. Base deployment stays AI-disabled.
services:
  app:
    environment:
      PT_MEDIA_AI_ENABLED: "1"
      PT_MEDIA_AI_MODEL: "${PT_MEDIA_AI_MODEL:-gpt-5.6-luna}"
      PT_MEDIA_AI_PROVIDER_TIMEOUT_MS: "${PT_MEDIA_AI_PROVIDER_TIMEOUT_MS:-30000}"
      PT_MEDIA_AI_TURN_TIMEOUT_MS: "${PT_MEDIA_AI_TURN_TIMEOUT_MS:-60000}"
      IVAN_ONLINE_API_URL: "${IVAN_ONLINE_API_URL:?Set the fixed HTTPS IVAN model API URL}"
      IVAN_ONLINE_API_KEY_FILE: /run/secrets/ivan_online_api_key
      # Compatibility aliases let the previous application image use the
      # same correctly paired gateway during a staged rollout or rollback.
      TRANS_STATION_BASE_URL: "${IVAN_ONLINE_API_URL:?Set the fixed HTTPS IVAN model API URL}"
      TRANS_STATION_API_KEY_FILE: /run/secrets/ivan_online_api_key
    secrets:
      - source: ivan_online_api_key
        target: ivan_online_api_key
secrets:
  ivan_online_api_key:
    file: "${IVAN_ONLINE_API_KEY_FILE:?Set the path to the mode-0600 IVAN model API key file}"
