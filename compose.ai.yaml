# Optional overlay: docker compose --env-file .env.server -f compose.yaml -f compose.ai.yaml up -d --build app
# Provision the API key file separately, mode 0600. Base deployment stays AI-disabled.
services:
  app:
    environment:
      PT_MEDIA_AI_ENABLED: "1"
      PT_MEDIA_AI_MODEL: "${PT_MEDIA_AI_MODEL:-deepseek-flash}"
      PT_MEDIA_AI_PROVIDER_TIMEOUT_MS: "${PT_MEDIA_AI_PROVIDER_TIMEOUT_MS:-30000}"
      PT_MEDIA_AI_TURN_TIMEOUT_MS: "${PT_MEDIA_AI_TURN_TIMEOUT_MS:-60000}"
      DS_BASE_URL: "${DS_BASE_URL:?Set the HTTPS DeepSeek OpenAI-compatible API URL}"
      DS_AUTH_TOKEN_FILE: /run/secrets/deepseek_api_key
    secrets:
      - source: deepseek_api_key
        target: deepseek_api_key
secrets:
  deepseek_api_key:
    file: "${DS_AUTH_TOKEN_FILE:?Set the path to the mode-0600 DeepSeek API key file}"
