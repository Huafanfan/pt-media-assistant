<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of the discovery browser</title>
  <desc id="desc">A generic dark themed discovery interface with collection cards and an availability inspector.</desc>
  <defs>
    <linearGradient id="shell" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101823"/>
      <stop offset="1" stop-color="#1b2b33"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#253943"/>
      <stop offset="1" stop-color="#1c2a33"/>
    </linearGradient>
    <linearGradient id="posterA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ef9a68"/>
      <stop offset="1" stop-color="#643e55"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5ec1b4"/>
      <stop offset="1" stop-color="#1b4a5b"/>
    </linearGradient>
    <linearGradient id="posterC" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eac66e"/>
      <stop offset="1" stop-color="#905a47"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#050b10" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1400" height="820" rx="32" fill="url(#shell)"/>
  <rect x="38" y="34" width="1324" height="752" rx="24" fill="#111c25" stroke="#40545a"/>
  <rect x="38" y="34" width="1324" height="72" rx="24" fill="#182731"/>
  <circle cx="78" cy="70" r="12" fill="#f56d5c"/>
  <circle cx="112" cy="70" r="12" fill="#eac66e"/>
  <circle cx="146" cy="70" r="12" fill="#7ee6d0"/>
  <text x="198" y="78" fill="#edf5f2" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">PT Media Assistant</text>
  <text x="1188" y="78" fill="#7ee6d0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">LAN · READY</text>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="82" y="164" fill="#f4f7f6" font-size="28" font-weight="800">发现</text>
    <text x="82" y="197" fill="#91a9ae" font-size="16">从公开榜单开始，先看，再决定。</text>
    <rect x="82" y="228" width="760" height="44" rx="14" fill="#20343c" stroke="#42636a"/>
    <text x="106" y="256" fill="#7f9a9f" font-size="15">搜索榜单或片名…</text>
    <rect x="82" y="302" width="226" height="38" rx="19" fill="#f56d5c"/>
    <text x="195" y="327" text-anchor="middle" fill="#fffaf4" font-size="14" font-weight="700">热门电影</text>
    <rect x="320" y="302" width="226" height="38" rx="19" fill="#233944" stroke="#42636a"/>
    <text x="433" y="327" text-anchor="middle" fill="#b3c6c6" font-size="14" font-weight="700">口碑电影</text>
    <rect x="558" y="302" width="226" height="38" rx="19" fill="#233944" stroke="#42636a"/>
    <text x="671" y="327" text-anchor="middle" fill="#b3c6c6" font-size="14" font-weight="700">热门剧集</text>

    <g filter="url(#shadow)">
      <rect x="82" y="382" width="226" height="290" rx="20" fill="url(#panel)" stroke="#3c555c"/>
      <rect x="326" y="382" width="226" height="290" rx="20" fill="url(#panel)" stroke="#3c555c"/>
      <rect x="570" y="382" width="226" height="290" rx="20" fill="url(#panel)" stroke="#3c555c"/>
    </g>
    <rect x="100" y="402" width="190" height="160" rx="14" fill="url(#posterA)"/>
    <circle cx="200" cy="478" r="44" fill="#ffe9c8" opacity=".25"/>
    <path d="M167 499L200 438L234 499" fill="none" stroke="#ffe9c8" stroke-width="8" opacity=".7"/>
    <rect x="344" y="402" width="190" height="160" rx="14" fill="url(#posterB)"/>
    <path d="M366 521C401 455 454 449 511 420" fill="none" stroke="#d4fff4" stroke-width="9" opacity=".55"/>
    <rect x="588" y="402" width="190" height="160" rx="14" fill="url(#posterC)"/>
    <circle cx="684" cy="478" r="47" fill="none" stroke="#fff2c8" stroke-width="8" opacity=".55"/>
    <g fill="#f4f7f6">
      <text x="100" y="600" font-size="20" font-weight="700">奥德赛</text>
      <text x="344" y="600" font-size="20" font-weight="700">空枪</text>
      <text x="588" y="600" font-size="20" font-weight="700">远方来信</text>
    </g>
    <g fill="#91a9ae" font-size="14">
      <text x="100" y="626">科幻 · 冒险 · 2026</text>
      <text x="344" y="626">剧情 · 2025</text>
      <text x="588" y="626">剧情 · 2024</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <rect x="872" y="142" width="444" height="584" rx="24" fill="#20333b" stroke="#5b7778"/>
    <text x="906" y="190" fill="#7ee6d0" font-size="14" font-weight="700" letter-spacing="1.5">AVAILABILITY INSPECTOR</text>
    <text x="906" y="232" fill="#f4f7f6" font-size="28" font-weight="800">奥德赛</text>
    <text x="906" y="260" fill="#91a9ae" font-size="15">正在查询已配置的 PT 索引器</text>
    <rect x="906" y="290" width="376" height="1" fill="#476167"/>
    <text x="906" y="332" fill="#f4f7f6" font-size="17" font-weight="700">可用片源 · 3</text>
    <g>
      <rect x="906" y="358" width="376" height="82" rx="16" fill="#263e45" stroke="#406167"/>
      <circle cx="934" cy="399" r="9" fill="#7ee6d0"/>
      <text x="958" y="390" fill="#edf5f2" font-size="15" font-weight="700">1080p · WEB-DL</text>
      <text x="958" y="416" fill="#91a9ae" font-size="13">做种 42 · 6.8 GB</text>
      <text x="1254" y="403" text-anchor="end" fill="#7ee6d0" font-size="13" font-weight="700">选择</text>
    </g>
    <g>
      <rect x="906" y="454" width="376" height="82" rx="16" fill="#263e45" stroke="#406167"/>
      <circle cx="934" cy="495" r="9" fill="#eac66e"/>
      <text x="958" y="486" fill="#edf5f2" font-size="15" font-weight="700">2160p · BluRay</text>
      <text x="958" y="512" fill="#91a9ae" font-size="13">做种 18 · 28.4 GB</text>
      <text x="1254" y="499" text-anchor="end" fill="#eac66e" font-size="13" font-weight="700">选择</text>
    </g>
    <rect x="906" y="570" width="376" height="54" rx="16" fill="#f56d5c"/>
    <text x="1094" y="604" text-anchor="middle" fill="#fffaf4" font-size="16" font-weight="800">确认后加入下载</text>
    <text x="906" y="674" fill="#91a9ae" font-size="13">示意图：标题、数量与体积均为占位数据。</text>
  </g>
</svg>
